<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markd</title>
    <script src="theme-loader.js"></script>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Library navigation">
        <h1>Markd</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
        <nav class="view-navigation" aria-label="Bookmark views">
          <button id="all-view" class="view-control active" type="button" aria-current="page">All</button>
          <button id="untagged-view" class="view-control" type="button" aria-current="false">Untagged</button>
        </nav>
        <section class="tag-catalog-section" aria-labelledby="tags-heading">
          <h2 id="tags-heading">Tags</h2>
          <div id="tag-catalog"><p class="tag-catalog-empty">No tags yet</p></div>
        </section>
      </aside>
      <section class="library-panel" aria-label="Bookmarks">
        <div class="search-control">
          <label for="bookmark-search">Search bookmarks</label>
          <input id="bookmark-search" type="search" autocomplete="off" placeholder="Title, URL, tags, notes, or folder" />
        </div>
        <p id="status" role="status">Loading bookmarks…</p>
        <div id="bookmarks"></div>
      </section>
    </main>
    <script type="module" src="library.js"></script>
  </body>
</html>
